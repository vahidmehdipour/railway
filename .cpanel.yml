---
deployment:
  tasks:
    - export DEPLOYPATH=/home3/hwuxndqg/rail.lemooshop.ir
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R deploy/public_html/. $DEPLOYPATH
    # Keep the host .htaccess: cPanel stores the PHP 8.4 handler there.
    - /bin/cp -n $DEPLOYPATH/.htaccess.dist $DEPLOYPATH/.htaccess
    # Restore the updater only after it has self-deleted following a run.
    - /bin/cp -n deploy/tools/_update.php $DEPLOYPATH/_update.php
